# ---------------------------------------------------------------------------
# Policy priorities
# ---------------------------------------------------------------------------
# Format: Policy: Policy Name — score
#
# Positive score = WANT this policy to exist / be added
# Negative score = do NOT want this policy / want it gone
# Absolute value = how strongly you care (same scale as stats above)
#
# When an issue option ADDS a listed policy:
#   positive pref → bonus points    |   negative pref → penalty points
# When an issue option REMOVES a listed policy:
#   positive pref → penalty points  |   negative pref → bonus points
#
# Policy names must match exactly what the results site shows (case-insensitive).
# Run the scraper first so the CSV contains policies_added / policies_removed data.
# ---------------------------------------------------------------------------

# Example entries — edit to match the policies you care about:
# Policy: Compulsory Organ Harvesting — 80      # want this policy
# Policy: Abortion — -90                        # do not want this policy
# Policy: Death Penalty — 70                    # want this policy
# Policy: Free Trade — -60                      # do not want this policy
# Policy: National Service — 85                 # want this policy
# Policy: Conscription — 90                     # want this policy
# Policy: Drug Legalisation — -85               # do not want this policy
# Policy: Euthanasia — -60                      # do not want this policy
# Policy: Capital Punishment — 75               # want this policy
# Policy: Human Experimentation — 50            # want this policy
